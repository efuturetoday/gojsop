name: counts only the pods its binding selects
cluster:
  - {apiVersion: v1, kind: Pod, metadata: {name: a, namespace: default, labels: {track: "true"}}}
  - {apiVersion: v1, kind: Pod, metadata: {name: b, namespace: default, labels: {track: "true"}}}
  - {apiVersion: v1, kind: Pod, metadata: {name: c, namespace: default}}
event:
  type: Added
  object: {apiVersion: v1, kind: Pod, metadata: {name: a, namespace: default, labels: {track: "true"}}}
expect:
  cluster:
    - apiVersion: v1
      kind: ConfigMap
      metadata: {name: pod-count, namespace: default}
      data: {count: "2"}
