{{- if .Values.rbacHelpers.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    labels:
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: {{ include "gojsop.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    name: {{ include "gojsop.resourceName" (dict "suffix" "jshook-admin-role" "context" $) }}
rules:
    - apiGroups:
        - core.gojsop.io
      resources:
        - jshooks
      verbs:
        - '*'
    - apiGroups:
        - core.gojsop.io
      resources:
        - jshooks/status
      verbs:
        - get
{{- end }}
