apiVersion: core.gojsop.io/v1alpha1
kind: JSHook
metadata:
  name: count-pods
spec:
  bindings:
    - name: pods
      apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["pods"]
      objectSelector:
        matchLabels: {track: "true"}
  permissions:
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get", "create", "patch"]
  # The tests run hook.ts. In the cluster the script is the ConfigMap that
  # kustomization.yaml builds from dist/hook.js (npm run build).
  source:
    configMapRef: {name: count-pods, namespace: gojsop-system, key: hook.js}
