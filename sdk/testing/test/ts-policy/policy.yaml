apiVersion: core.gojsop.io/v1alpha1
kind: JSAdmission
metadata:
  name: no-latest
spec:
  type: validating
  rules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["pods"]
      operations: ["CREATE", "UPDATE"]
  # Audit records what the policy would deny and blocks nothing; switch to
  # Deny once kubectl describe jsadmission no-latest shows no surprises.
  enforcement: Deny
  # The tests run policy.ts. In the cluster the script is the ConfigMap that
  # kustomization.yaml builds from dist/policy.js (npm run build).
  source:
    configMapRef: {name: no-latest, namespace: gojsop-system, key: policy.js}
