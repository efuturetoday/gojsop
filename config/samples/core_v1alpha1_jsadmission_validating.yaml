apiVersion: core.gojsop.io/v1alpha1
kind: JSAdmission
metadata:
  labels:
    app.kubernetes.io/name: gojsop
    app.kubernetes.io/managed-by: kustomize
  name: prevent-latest-tags
spec:
  type: validating
  rules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["pods"]
      operations: ["CREATE", "UPDATE"]
  failurePolicy: Fail
  source:
    inline: |
      function validate(req) {
        // Empty fields are missing and req.object is null on DELETE:
        // reach into objects with ?. and ??.
        for (const c of req.object?.spec?.containers ?? []) {
          if (c.image?.endsWith(":latest")) {
            return { allowed: false, message: "image " + c.image + " uses :latest, refusing" };
          }
        }
        return { allowed: true };
      }
