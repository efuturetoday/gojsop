apiVersion: core.gojsop.io/v1alpha1
kind: JSHook
metadata:
  labels:
    app.kubernetes.io/name: gojsop
    app.kubernetes.io/managed-by: kustomize
  name: jshook-sample
spec:
  source:
    inline: |
      // Top-level state — survives across handle() calls thanks to the
      // persistent QuickJS instance.
      var seen = 0;

      function config() {
        return {
          configVersion: "v1",
          onStartup: 1,
          kubernetes: [{
            name: "watch-configmaps",
            apiVersion: "v1",
            kind: "ConfigMap",
            executeHookOnEvent: ["Added", "Modified", "Deleted"],
            namespace: { nameSelector: { matchNames: ["default"] } },
          }],
        };
      }

      function handle(ctx) {
        for (const evt of ctx) {
          seen++;
          // host-bound logger; arrives once host_log.go is wired in.
          // log.info("event", evt.type, "for", evt.object?.metadata?.name, "total seen:", seen);
        }
      }
  resources:
    memoryMB: 32
    timeoutSeconds: 30
