apiVersion: core.gojsop.io/v1alpha1
kind: JSHook
metadata:
  labels:
    app.kubernetes.io/name: gojsop
    app.kubernetes.io/managed-by: kustomize
  name: configmap-sync
spec:
  bindings:
    - name: watch-source-configmaps
      apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["configmaps"]
      events: ["Added", "Modified", "Deleted"]
      # Only ConfigMaps that opt in reach the script. Filtering here instead
      # of in JS keeps the watch cheap and the hook's scope readable.
      objectSelector:
        matchLabels:
          gojsop.io/sync: "true"
  # What the script may do through kube.*. The hook runs as a ServiceAccount
  # of its own with exactly these rights, plus read access to what the
  # bindings watch. Whoever applies this hook must hold these rights too.
  permissions:
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get", "create", "patch"]
  source:
    inline: |
      // Every call starts from a fresh snapshot of this script, so globals
      // set inside handle() are gone at the next call.
      function handle(ctx) {
        for (const evt of ctx) {
          const obj = evt.object;
          if (!obj || !obj.metadata) continue;
          const ann = obj.metadata.annotations || {};
          const targets = ann["gojsop.io/sync-to"];
          if (!targets) continue;
          const namespaces = targets.split(",").map(s => s.trim()).filter(Boolean);
          for (const ns of namespaces) {
            if (ns === obj.metadata.namespace) continue; // never copy onto self
            // console.log and console.debug go to the operator log;
            // console.warn and console.error also show up as Warning events
            // on this JSHook (kubectl describe jshook configmap-sync).
            console.debug("syncing", obj.metadata.name, "to", ns);
            kube.apply({
              apiVersion: "v1",
              kind: "ConfigMap",
              metadata: {
                name: obj.metadata.name,
                namespace: ns,
                labels: { "gojsop.io/synced-from": obj.metadata.namespace },
              },
              data: obj.data || {},
            });
          }
        }
      }
  limits:
    memoryMB: 32
    timeoutSeconds: 30
