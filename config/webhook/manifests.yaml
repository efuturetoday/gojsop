---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-core-gojsop-io-v1alpha1-jsadmission
  failurePolicy: Fail
  name: mjsadmission-v1alpha1.kb.io
  rules:
  - apiGroups:
    - core.gojsop.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - jsadmissions
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-gojsop-access
  failurePolicy: Fail
  name: access.gojsop.io
  rules:
  - apiGroups:
    - core.gojsop.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - jshooks
    - jsadmissions
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-core-gojsop-io-v1alpha1-jsadmission
  failurePolicy: Fail
  name: vjsadmission-v1alpha1.kb.io
  rules:
  - apiGroups:
    - core.gojsop.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - jsadmissions
  sideEffects: None
