---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: jshooks.core.gojsop.io
spec:
  group: core.gojsop.io
  names:
    kind: JSHook
    listKind: JSHookList
    plural: jshooks
    shortNames:
    - jshook
    singular: jshook
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.bindings[*]
      name: Bindings
      priority: 1
      type: integer
    - jsonPath: .status.instance.restartCount
      name: Restarts
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          JSHook declares a JavaScript-based Kubernetes hook. The controller loads
          the module, calls its config() export to learn which events to subscribe to,
          then dispatches matching events to its handle() export.

          JSHook is cluster-scoped because hooks typically observe resources across
          namespaces.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of JSHook
            properties:
              resources:
                description: Resources caps memory and per-call execution time of
                  the JS instance.
                properties:
                  memoryMB:
                    description: MemoryMB is the hard limit on the QuickJS heap in
                      megabytes. Default 32.
                    format: int32
                    type: integer
                  timeoutSeconds:
                    description: |-
                      TimeoutSeconds bounds a single handle() call. Default 30.
                      On timeout the call is interrupted; the persistent instance survives
                      unless timeouts repeat (see status.instance.lastRestartReason).
                    format: int32
                    type: integer
                type: object
              source:
                description: Source is where to load the hook's JS module from.
                properties:
                  configMapRef:
                    description: ConfigMapRef pulls the JS module text from a key
                      in a ConfigMap.
                    properties:
                      key:
                        description: Key inside the ConfigMap. Defaults to "hook.js".
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  inline:
                    description: |-
                      Inline embeds the JS module text directly into the JSHook resource.
                      Convenient for small hooks and demos.
                    type: string
                  ociRef:
                    description: |-
                      OCIRef pulls the JS module from an OCI artifact (e.g. ghcr.io/foo/hook:v1).
                      The artifact must contain a single layer whose body is the JS source.
                    type: string
                type: object
            required:
            - source
            type: object
          status:
            description: status defines the observed state of JSHook
            properties:
              bindings:
                description: |-
                  Bindings are the resolved bindings the hook declared in its config()
                  call (kubernetes/schedule/onStartup), echoed here so users can see what
                  the hook is subscribed to.
                items:
                  type: string
                type: array
              conditions:
                description: Conditions follows standard Kubernetes condition conventions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              instance:
                description: Instance reports the lifecycle of the persistent JS runtime.
                properties:
                  lastRestartReason:
                    description: |-
                      LastRestartReason is one of: source-changed, memory-limit, panic,
                      timeout-streak, manual.
                    type: string
                  manualRestartToken:
                    description: |-
                      ManualRestartToken echoes the value of the gojsop.io/restart annotation
                      that produced the most recent manual restart. Setting the annotation to
                      a new value triggers exactly one restart; re-reconciles with the same
                      value are no-ops.
                    type: string
                  restartCount:
                    description: |-
                      RestartCount counts how often the persistent instance has been replaced
                      since the JSHook was created.
                    format: int32
                    type: integer
                  sourceHash:
                    description: |-
                      SourceHash is a sha256 of the loaded JS source. A change here triggers
                      a controlled instance restart.
                    type: string
                  startedAt:
                    description: StartedAt is when the current persistent instance
                      was created.
                    format: date-time
                    type: string
                type: object
              lastExecution:
                description: LastExecution reports the most recent handle() call.
                properties:
                  durationMs:
                    format: int64
                    type: integer
                  error:
                    description: Error is non-empty if the last call failed.
                    type: string
                  time:
                    format: date-time
                    type: string
                type: object
              observedGeneration:
                description: ObservedGeneration is the generation last reconciled
                  by the controller.
                format: int64
                type: integer
              phase:
                description: 'Phase is a coarse rollup: Pending, Ready, Failed.'
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
