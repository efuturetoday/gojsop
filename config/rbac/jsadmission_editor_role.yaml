# This rule is not used by the project gojsop itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the core.gojsop.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: gojsop
    app.kubernetes.io/managed-by: kustomize
  name: jsadmission-editor-role
rules:
- apiGroups:
  - core.gojsop.io
  resources:
  - jsadmissions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - core.gojsop.io
  resources:
  - jsadmissions/status
  verbs:
  - get
