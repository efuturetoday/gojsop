# Binds manager-namespace-role: the operator may create and impersonate
# ServiceAccounts in its own namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: gojsop
    app.kubernetes.io/managed-by: kustomize
  name: manager-namespace-rolebinding
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manager-namespace-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
