name: Tests

on:
  push:
  pull_request:

# Read the repository, nothing else (least privilege for GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  test:
    name: unit and envtest
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test
