name: Tests

# Pull requests run here; push only for main, so a PR branch does not run
# twice.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR, or a new merge to main, cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read the repository, nothing else (least privilege for GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  test:
    name: unit and envtest
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: make test

  sdk:
    name: npm packages
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Format and lint with Biome
        run: make sdk-lint

      - name: Test with vitest against bin/gojsop
        run: make sdk-test

      - name: Install the packed packages and test a new workspace
        run: make sdk-smoke
