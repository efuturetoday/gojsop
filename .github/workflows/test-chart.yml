name: Test Chart

# Pull requests run here; push only for main, so a PR branch does not run
# twice.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR, or a new merge to main, cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read the repository, nothing else (least privilege for GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  test-chart:
    name: Helm chart on Kind
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - uses: docker/setup-buildx-action@v4

      - name: Build the manager image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: gojsop:ci
          cache-from: type=gha,scope=manager
          cache-to: type=gha,scope=manager,mode=max

      - name: Load the image into kind
        run: kind load docker-image gojsop:ci

      - uses: azure/setup-helm@v5

      - name: Verify Helm installation
        run: helm version

      - name: Generate the chart templates from config/
        run: make chart

      - name: Lint Helm Chart
        run: |
          helm lint ./deploy/chart


      - name: Install cert-manager via Helm (wait for readiness)
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 300s

# TODO: Uncomment if Prometheus is enabled
#      - name: Install Prometheus Operator CRDs
#        run: |
#          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#          helm repo update
#          helm install prometheus-crds prometheus-community/prometheus-operator-crds

      - name: Install Helm chart for project
        run: |
          # The image built above, and wait until the operator is ready: a
          # chart that installs but whose operator cannot start is broken.
          helm install my-release ./deploy/chart --create-namespace --namespace gojsop-system \
            --set manager.image.repository=gojsop --set manager.image.tag=ci \
            --wait --timeout 300s

      - name: Check Helm release status
        run: |
          helm status my-release --namespace gojsop-system
