name: E2E Tests

# Pull requests run here; push only for main, so a PR branch does not run
# twice.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR, or a new merge to main, cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read the repository, nothing else (least privilege for GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  test-e2e:
    name: e2e on Kind
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - uses: docker/setup-buildx-action@v4

      - name: Build the manager image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: example.com/gojsop:v0.0.1 # managerImage in test/e2e
          cache-from: type=gha,scope=manager
          cache-to: type=gha,scope=manager,mode=max

      - name: Running Test e2e
        env:
          E2E_IMAGE_PREBUILT: "true"
        run: make test-e2e
