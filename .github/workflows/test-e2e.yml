name: E2E Tests

on:
  push:
  pull_request:

# Read the repository, nothing else (least privilege for GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  test-e2e:
    name: e2e on Kind
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
