name: Release

# release-please keeps a release PR open that collects the conventional
# commits on main. Merging it tags vX.Y.Z and creates the GitHub release;
# the publish job then pushes the image, the Helm chart, install.yaml, the
# CLI binaries and the npm packages (@gojsop/cli, @gojsop/testing,
# @gojsop/create).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write # npm provenance and trusted publishing
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest

      - uses: azure/setup-helm@v5

      - name: Push the Helm chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          make chart
          helm package deploy/chart --version "$VERSION" --app-version "$VERSION"
          helm push "gojsop-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Attach the gojsop CLI to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make cli-dist VERSION="$VERSION"
          (cd dist/cli && sha256sum * > checksums.txt)
          gh release upload "$TAG" dist/cli/*

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) once it is set up for each package on
      # npmjs.com; until then the token in the secret NPM_TOKEN.
      - name: Publish the npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: sdk
        run: |
          npm ci
          npm run build
          node scripts/publish.ts --version "$VERSION" --bin-dir ../dist/cli

      - name: Attach install.yaml to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make build-installer IMG="$IMAGE:$VERSION"
          gh release upload "$TAG" dist/install.yaml
