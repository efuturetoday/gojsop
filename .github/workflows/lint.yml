name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.7.2

      - name: Check .agents against the SDLC method
        run: make sdlc-check
        env:
          GOPRIVATE: github.com/efuturetoday
          # needs a token with read access to efuturetoday/agentic-sdlc (GATE-25)
